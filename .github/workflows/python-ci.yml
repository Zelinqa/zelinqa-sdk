name: Python SDK CI

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'typescript/src/types.ts'
      - 'typescript/src/generated/**'
      - 'python/**'
      - 'openapi/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
      - '.github/workflows/publish-python-sdk.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'typescript/src/types.ts'
      - 'typescript/src/generated/**'
      - 'python/**'
      - 'openapi/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
      - '.github/workflows/publish-python-sdk.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Lint
        run: uv run ruff check python/src python/tests

      - name: Format
        run: uv run ruff format --check python/src python/tests

      - name: Type check
        run: uv run mypy python/src

      - name: Test
        # The `live` marker is excluded by the addopts of pyproject.toml: the
        # live suite runs only from the manual live-tests workflow.
        run: uv run pytest

      - name: Build source and wheel distributions
        run: uv build --out-dir dist

      - name: Validate package metadata and README rendering
        run: uv run twine check dist/*
