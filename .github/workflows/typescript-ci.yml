name: TypeScript SDK CI

on:
  # Required checks must report a result for every pull request, whatever it touches.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'PUBLISHING.md'
      - 'typescript/**'
      - 'openapi/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - 'vitest.config.ts'
      - 'vitest.live.config.ts'
      - '.changeset/**'
      - '.github/workflows/typescript-ci.yml'
      - '.github/workflows/publish-typescript-sdk.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the generated types match the OpenAPI contract
        run: |
          pnpm generate:types
          git diff --exit-code typescript/src/generated

      - name: Lint, type check, test, and verify versions
        run: pnpm check

      - name: Build ESM, CommonJS, and type declarations
        run: pnpm build

      - name: Build the npm tarball
        run: pnpm pack --pack-destination package-artifacts
