<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Test bench, September 2026: 70 percent fewer tokens, 77 percent of objectives reached against 17 percent, seven use cases."><rect width="1200" height="190" fill="#0F1020"/><rect x="20" y="16" width="370" height="158" rx="16" fill="#181A33" stroke="#2A2B45" stroke-width="2"/><rect x="20" y="16" width="6" height="158" rx="3" fill="#8B7CF0"/><text x="52" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#8B7CF0">−70 %</text><text x="52" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F3F2FA">tokens consumed</text><text x="52" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A5A6B8">for a dialogue of the same length</text><rect x="410" y="16" width="370" height="158" rx="16" fill="#181A33" stroke="#2A2B45" stroke-width="2"/><rect x="410" y="16" width="6" height="158" rx="3" fill="#2ABB9F"/><text x="442" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#2ABB9F">77 % vs 17 %</text><text x="442" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F3F2FA">objectives reached</text><text x="442" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A5A6B8">with the engine vs the same assistant alone</text><rect x="800" y="16" width="370" height="158" rx="16" fill="#181A33" stroke="#2A2B45" stroke-width="2"/><rect x="800" y="16" width="6" height="158" rx="3" fill="#8B7CF0"/><text x="832" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#8B7CF0">7 use cases</text><text x="832" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F3F2FA">from lead qualification</text><text x="832" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A5A6B8">to pre-interviews and diagnosis</text></svg>
