<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Test bench, September 2026: 70 percent fewer tokens, 77 percent of objectives reached against 17 percent, seven use cases."><rect width="1200" height="190" fill="#FBFAF6"/><rect x="20" y="16" width="370" height="158" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="20" y="16" width="6" height="158" rx="3" fill="#6B5BD6"/><text x="52" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#6B5BD6">−70 %</text><text x="52" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1A2D">tokens consumed</text><text x="52" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#686A73">for a dialogue of the same length</text><rect x="410" y="16" width="370" height="158" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="410" y="16" width="6" height="158" rx="3" fill="#2ABB9F"/><text x="442" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#2ABB9F">77 % vs 17 %</text><text x="442" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1A2D">objectives reached</text><text x="442" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#686A73">with the engine vs the same assistant alone</text><rect x="800" y="16" width="370" height="158" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="800" y="16" width="6" height="158" rx="3" fill="#6B5BD6"/><text x="832" y="86" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#6B5BD6">7 use cases</text><text x="832" y="120" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1A2D">from lead qualification</text><text x="832" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#686A73">to pre-interviews and diagnosis</text></svg>
