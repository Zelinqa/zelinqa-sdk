<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Test bench, September 2026: 70 percent fewer tokens consumed, measured on more than 700 conversations across seven use cases."><rect width="1200" height="190" fill="#FBFAF6"/><rect x="20" y="16" width="640" height="158" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="20" y="16" width="6" height="158" rx="3" fill="#6B5BD6"/><text x="52" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#6B5BD6">−70 %</text><text x="52" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1A2D">tokens consumed with the Zelinqa engine</text><text x="52" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#686A73">same assistant, same dialogue length, measured per conversation</text><rect x="680" y="16" width="500" height="158" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="680" y="16" width="6" height="158" rx="3" fill="#2ABB9F"/><text x="712" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#2ABB9F">700+</text><text x="712" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1A1A2D">conversations, 7 use cases</text><text x="712" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#686A73">replayed twice: assistant alone, then steered by the engine</text></svg>
