<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="70 percent fewer tokens, measured on 700+ conversations; deterministic: the same state returns the same question and choosing never calls a model; explainable: every question says what it collects and progress is reported per dimension."><rect width="1200" height="200" fill="#FBFAF6"/><rect x="20" y="16" width="370" height="168" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="20" y="16" width="6" height="168" rx="3" fill="#6B5BD6"/><text x="52" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#6B5BD6">−70 %</text><text x="52" y="110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A2D">tokens</text><text x="52" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">measured on 700+ conversations,</text><text x="52" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">same assistant, same dialogue length</text><rect x="410" y="16" width="370" height="168" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="410" y="16" width="6" height="168" rx="3" fill="#2ABB9F"/><text x="442" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#2ABB9F">Deterministic</text><text x="442" y="110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A2D">same state, same question</text><text x="442" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">choosing the question never calls a model:</text><text x="442" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">no drift, no surprise between two runs</text><rect x="800" y="16" width="370" height="168" rx="16" fill="#FFFFFF" stroke="#E2E1EC" stroke-width="2"/><rect x="800" y="16" width="6" height="168" rx="3" fill="#6B5BD6"/><text x="832" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#6B5BD6">Explainable</text><text x="832" y="110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1A1A2D">every question says why</text><text x="832" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">what it collects, progress per dimension,</text><text x="832" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#686A73">explicit stop reasons and warnings</text></svg>
