<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Without Zelinqa, the LLM generates every question and decides with gaps. With Zelinqa, the engine runs the questioning phase from the published domain and the LLM decides once, with a complete typed state."><rect width="1200" height="560" fill="#0F1020"/><rect x="60" y="20" width="1080" height="235" rx="18" fill="#181A33" stroke="#C8524A" stroke-width="2"/><text x="88" y="60" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C8524A">LLM ALONE</text><text x="88" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">The same model asks and decides</text><rect x="960" y="42" width="92" height="28" rx="14" fill="#C8524A"/><text x="1006.0" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">GUESSES</text><rect x="88" y="106" width="300" height="125" rx="12" fill="#3A1F2E" stroke="#C8524A" stroke-width="1.5"/><text x="104" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">1 · Asks</text><text x="104" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Generates every question</text><text x="104" y="179" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Order drifts with the chat</text><text x="104" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Tokens on each turn</text><line x1="394" y1="168" x2="424" y2="168" stroke="#A5A6B8" stroke-width="2.5"/><polygon points="424,161 434,168 424,175" fill="#A5A6B8"/><rect x="440" y="106" width="300" height="125" rx="12" fill="#3A1F2E" stroke="#C8524A" stroke-width="1.5"/><text x="456" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">2 · Collects</text><text x="456" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Answers buried in the transcript</text><text x="456" y="179" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">No notion of what is still missing</text><text x="456" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Re-asks or forgets</text><line x1="746" y1="168" x2="776" y2="168" stroke="#A5A6B8" stroke-width="2.5"/><polygon points="776,161 786,168 776,175" fill="#A5A6B8"/><rect x="792" y="106" width="300" height="125" rx="12" fill="#3A1F2E" stroke="#C8524A" stroke-width="1.5"/><text x="808" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">3 · Decides</text><text x="808" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Decides with gaps</text><text x="808" y="179" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Hard to audit why</text><text x="808" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Quality varies per conversation</text><rect x="60" y="275" width="1080" height="235" rx="18" fill="#181A33" stroke="#8B7CF0" stroke-width="3"/><text x="88" y="315" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8B7CF0">WITH ZELINQA</text><text x="88" y="339" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">The engine asks, the model decides</text><rect x="972" y="297" width="80" height="28" rx="14" fill="#8B7CF0"/><text x="1012.0" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">KNOWS</text><rect x="88" y="361" width="300" height="125" rx="12" fill="#262848" stroke="#8B7CF0" stroke-width="1.5"/><text x="104" y="387" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">1 · Zelinqa asks</text><text x="104" y="413" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Picks the next question from your</text><text x="104" y="434" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">published domain, no model call to choose</text><text x="104" y="455" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Deterministic, fast, auditable</text><line x1="394" y1="423" x2="424" y2="423" stroke="#A5A6B8" stroke-width="2.5"/><polygon points="424,416 434,423 424,430" fill="#A5A6B8"/><rect x="440" y="361" width="300" height="125" rx="12" fill="#262848" stroke="#8B7CF0" stroke-width="1.5"/><text x="456" y="387" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">2 · Zelinqa tracks</text><text x="456" y="413" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Typed state: known, missing, covered</text><text x="456" y="434" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Progress per dimension</text><text x="456" y="455" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Stops when the objective is met</text><line x1="746" y1="423" x2="776" y2="423" stroke="#A5A6B8" stroke-width="2.5"/><polygon points="776,416 786,423 776,430" fill="#A5A6B8"/><rect x="792" y="361" width="300" height="125" rx="12" fill="#262848" stroke="#2ABB9F" stroke-width="1.5"/><text x="808" y="387" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F2FA">3 · LLM decides</text><text x="808" y="413" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Receives the complete typed state</text><text x="808" y="434" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Answers or acts once, with everything</text><text x="808" y="455" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A5A6B8">Any model, any framework</text><text x="60" y="545" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A5A6B8">Same model, same framework. Zelinqa adds the questioning layer in front of it.  ·  zelinqa.ai</text></svg>
