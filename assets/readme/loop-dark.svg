<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Your application sends each reply; the Zelinqa engine returns the next question or a stop, with progress per dimension."><rect width="1200" height="420" fill="#0F1020"/><rect x="60" y="110" width="330" height="150" rx="14" fill="#181A33" stroke="#2A2B45" stroke-width="2"/><text x="225.0" y="144" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F3F2FA">Your application</text><text x="225.0" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Chat, form, voice agent, CRM flow</text><text x="225.0" y="194" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Owns the wording and the UI</text><text x="225.0" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Keeps session.id to resume</text><rect x="810" y="110" width="330" height="150" rx="14" fill="#181A33" stroke="#8B7CF0" stroke-width="3"/><text x="975.0" y="144" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F3F2FA">Zelinqa engine</text><text x="975.0" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Reads the reply, updates what is known</text><text x="975.0" y="194" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Measures each dimension</text><text x="975.0" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">Picks the question with the best gain</text><line x1="390" y1="160" x2="810" y2="160" stroke="#8B7CF0" stroke-width="3"/><polygon points="810,160 798,153 798,167" fill="#8B7CF0"/><text x="600.0" y="148" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#F3F2FA">start_session()  ·  session.answer(reply)</text><line x1="810" y1="215" x2="390" y2="215" stroke="#2ABB9F" stroke-width="3"/><polygon points="390,215 402,208 402,222" fill="#2ABB9F"/><text x="600.0" y="239" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#F3F2FA">next question  |  stop  +  progress per dimension</text><rect x="300" y="310" width="600" height="72" rx="14" fill="#262848"/><text x="600" y="340" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F3F2FA">Published domain, configured once in Zelinqa Studio</text><text x="600" y="365" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#A5A6B8">dimensions to cover  ·  questions and the information they collect  ·  objective</text><line x1="600" y1="310" x2="600" y2="262" stroke="#A5A6B8" stroke-width="2" stroke-dasharray="6 6"/><line x1="975" y1="260" x2="975" y2="346" stroke="#A5A6B8" stroke-width="2" stroke-dasharray="6 6"/><line x1="975" y1="346" x2="900" y2="346" stroke="#A5A6B8" stroke-width="2" stroke-dasharray="6 6"/></svg>
