      value:
        request_id: req_1003
        session_id: ses_01J8Z
        decision_id: dec_8c11
        action: ask
        stop_reason: null
        candidates:
          - rank: 1
            question_id: q_delai
            text: À quelle période souhaitez-vous être livré ?
            type: single_choice
            choices:
              - choice_id: choice_1m
                label: Dans le mois
              - choice_id: choice_3m
                label: Dans les trois mois
              - choice_id: choice_later
                label: Plus tard
            target_ids: [delivery_window]
        progress:
          objective:
            computed_status: in_progress
            progress: 0.86
            client_override: null
            effective_status: in_progress
          dimensions:
            - id: so_besoin
              order_position: 0
              completion_role: blocking
              computed_status: covered
              progress: 1
              client_override: null
              effective_status: covered
            - id: so_budget
              order_position: 1
              completion_role: blocking
              computed_status: covered
              progress: 1
