          state_version: 21
          engine_version: 1.0.0
          api_version: '1.0'

    ArretSansQuestion:
      summary: Aucune question identifiable ne subsiste après les exclusions dures
      value:
        request_id: req_1004
        session_id: ses_01J8Z
        decision_id: null
        action: stop
        stop_reason: no_question_available
        candidates: []
        progress:
          objective:
            computed_status: covered
            progress: 1
            client_override: null
            effective_status: covered
          dimensions:
            - id: so_besoin
              order_position: 0
              completion_role: blocking
              computed_status: covered
              progress: 1
              client_override: null
              effective_status: covered
            - id: so_budget
              order_position: 1
              completion_role: blocking
              computed_status: covered
              progress: 1
              client_override: null
              effective_status: covered
            - id: so_livraison
